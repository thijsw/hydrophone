<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb56b"/>
      <stop offset="100%" stop-color="#ff7e4f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123c5e"/>
      <stop offset="100%" stop-color="#041c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <clipPath id="below"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0a1622" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <g clip-path="url(#sq)">
      <rect x="100" y="100" width="824" height="412" fill="url(#sky)"/>
      <rect x="100" y="512" width="824" height="412" fill="url(#sea)"/>
      <rect x="100" y="100" width="824" height="412" fill="url(#glow)"/>

      <!-- play triangle: crisp above the waterline -->
      <g clip-path="url(#above)">
        <path d="M404.9 339 L685.1 512 L404.9 685 Z" fill="#ffffff" stroke="#ffffff" stroke-width="41" stroke-linejoin="round"/>
      </g>
      <!-- submerged part: shifted and tinted, as if refracted -->
      <g clip-path="url(#below)">
        <path d="M404.9 339 L685.1 512 L404.9 685 Z" transform="translate(20.6,0)" fill="#ffc79b" stroke="#ffc79b" stroke-width="41" stroke-linejoin="round" opacity="0.85"/>
      </g>

      <!-- waterline -->
      <rect x="100" y="506.5" width="824" height="11" fill="#fff0d9" opacity="0.7"/>
    </g>
  </g>
</svg>
